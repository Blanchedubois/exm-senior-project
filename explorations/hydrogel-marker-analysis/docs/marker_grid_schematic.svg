<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="checker" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#0f1115"/>
      <rect width="13" height="13" fill="#7fd4f2"/>
      <rect x="13" y="13" width="13" height="13" fill="#7fd4f2"/>
    </pattern>
  </defs>

  <rect width="1120" height="680" fill="#0f1115"/>
  <text x="560" y="38" fill="#f2f4f8" font-size="24" font-weight="700" text-anchor="middle">Coded boxes + fine interior checkerboard → distortion field</text>
  <text x="560" y="64" fill="#9aa4b2" font-size="14" text-anchor="middle">ArUco tags at box corners = box address · fine checkerboard inside = dense local measurement · Nanoscribe-printed</text>

  <!-- ===================== LEFT: reference ===================== -->
  <text x="245" y="106" fill="#c7d0dc" font-size="16" font-weight="600" text-anchor="middle">Reference (as-printed)</text>
  <rect x="80" y="124" width="330" height="330" rx="8" fill="#161a21" stroke="#2a313c"/>

  <!-- nodes at (130,174),(270,174),... spacing 140; 3x3 nodes → 2x2 boxes -->
  <!-- box interiors filled with fine checkerboard, inset 22px for quiet zone -->
  <g>
    <rect x="152" y="196" width="96" height="96" fill="url(#checker)"/>
    <rect x="292" y="196" width="96" height="96" fill="url(#checker)"/>
    <rect x="152" y="336" width="96" height="96" fill="url(#checker)"/>
    <rect x="292" y="336" width="96" height="96" fill="url(#checker)"/>
  </g>
  <!-- box outlines -->
  <g stroke="#3a434f" stroke-width="1" fill="none">
    <rect x="130" y="174" width="140" height="140"/>
    <rect x="270" y="174" width="140" height="140"/>
    <rect x="130" y="314" width="140" height="140"/>
    <rect x="270" y="314" width="140" height="140"/>
  </g>
  <!-- ArUco tags at the 9 nodes (mini bit matrices) -->
  <g>
    <!-- reusable-ish tags drawn inline; 26x26, centered on node -->
    <g transform="translate(117,161)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="4" y="4" width="6" height="6" fill="#e8edf3"/><rect x="16" y="4" width="6" height="6" fill="#e8edf3"/><rect x="10" y="10" width="6" height="6" fill="#e8edf3"/><rect x="4" y="16" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(257,161)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="10" y="4" width="6" height="6" fill="#e8edf3"/><rect x="4" y="10" width="6" height="6" fill="#e8edf3"/><rect x="16" y="10" width="6" height="6" fill="#e8edf3"/><rect x="16" y="16" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(397,161)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="4" y="4" width="6" height="6" fill="#e8edf3"/><rect x="16" y="16" width="6" height="6" fill="#e8edf3"/><rect x="10" y="10" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(117,301)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="16" y="4" width="6" height="6" fill="#e8edf3"/><rect x="4" y="16" width="6" height="6" fill="#e8edf3"/><rect x="10" y="10" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(257,301)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="4" y="4" width="6" height="6" fill="#e8edf3"/><rect x="16" y="4" width="6" height="6" fill="#e8edf3"/><rect x="16" y="16" width="6" height="6" fill="#e8edf3"/><rect x="4" y="16" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(397,301)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="10" y="4" width="6" height="6" fill="#e8edf3"/><rect x="10" y="16" width="6" height="6" fill="#e8edf3"/><rect x="4" y="10" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(117,441)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="4" y="4" width="6" height="6" fill="#e8edf3"/><rect x="16" y="10" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(257,441)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="16" y="4" width="6" height="6" fill="#e8edf3"/><rect x="4" y="16" width="6" height="6" fill="#e8edf3"/><rect x="10" y="10" width="6" height="6" fill="#e8edf3"/></g>
    <g transform="translate(397,441)"><rect width="26" height="26" fill="#12161c" stroke="#f5b301" stroke-width="1"/><rect x="4" y="10" width="6" height="6" fill="#e8edf3"/><rect x="16" y="4" width="6" height="6" fill="#e8edf3"/><rect x="16" y="16" width="6" height="6" fill="#e8edf3"/></g>
  </g>
  <!-- label one box -->
  <text x="200" y="248" fill="#f5b301" font-size="11" font-weight="600" text-anchor="middle" opacity="0.9">box (0,0)</text>
  <text x="245" y="485" fill="#f5b301" font-size="12" text-anchor="middle">▪ ArUco at corners = box number (address)</text>
  <text x="245" y="503" fill="#7fd4f2" font-size="12" text-anchor="middle">▨ fine checkerboard = dense local measurement</text>

  <!-- arrow -->
  <g>
    <line x1="420" y1="300" x2="480" y2="300" stroke="#6b7686" stroke-width="2"/>
    <polygon points="480,294 494,300 480,306" fill="#6b7686"/>
    <text x="457" y="288" fill="#9aa4b2" font-size="12" text-anchor="middle">expand 2–5×</text>
  </g>

  <!-- ===================== RIGHT: expanded + warped ===================== -->
  <text x="745" y="106" fill="#c7d0dc" font-size="16" font-weight="600" text-anchor="middle">Expanded &amp; warped (measured)</text>
  <rect x="510" y="124" width="530" height="330" rx="8" fill="#161a21" stroke="#2a313c"/>

  <!-- one deformed box: 4 corner node tags (anchors) + warped fine-corner lattice with residual vectors -->
  <!-- deformed box corners (a sheared/bulged quad) -->
  <g stroke="#f5b301" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M600,180 Q775,168 950,184 Q965,300 948,415 Q775,430 602,414 Q588,300 600,180 Z"/>
  </g>
  <!-- node ArUco anchors at deformed corners -->
  <g fill="#12161c" stroke="#f5b301" stroke-width="1">
    <rect x="588" y="168" width="24" height="24"/><rect x="938" y="172" width="24" height="24"/>
    <rect x="590" y="402" width="24" height="24"/><rect x="936" y="403" width="24" height="24"/>
  </g>
  <!-- faint uniform-expectation fine lattice -->
  <g stroke="#3a434f" stroke-width="0.8" fill="none" opacity="0.45">
    <line x1="650" y1="230" x2="900" y2="230"/><line x1="650" y1="300" x2="900" y2="300"/><line x1="650" y1="370" x2="900" y2="370"/>
    <line x1="650" y1="230" x2="650" y2="370"/><line x1="712" y1="230" x2="712" y2="370"/><line x1="775" y1="230" x2="775" y2="370"/><line x1="838" y1="230" x2="838" y2="370"/><line x1="900" y1="230" x2="900" y2="370"/>
  </g>
  <!-- measured fine corners with residual displacement vectors (central bulge) -->
  <g stroke="#f26d6d" stroke-width="1.8">
    <line x1="712" y1="230" x2="720" y2="221"/><line x1="775" y1="230" x2="780" y2="219"/><line x1="838" y1="230" x2="831" y2="222"/>
    <line x1="712" y1="300" x2="723" y2="300"/><line x1="838" y1="300" x2="827" y2="300"/>
    <line x1="712" y1="370" x2="719" y2="379"/><line x1="775" y1="370" x2="779" y2="382"/><line x1="838" y1="370" x2="830" y2="378"/>
  </g>
  <g fill="#f26d6d">
    <circle cx="650" cy="230" r="3"/><circle cx="720" cy="221" r="3"/><circle cx="780" cy="219" r="3"/><circle cx="831" cy="222" r="3"/><circle cx="900" cy="230" r="3"/>
    <circle cx="650" cy="300" r="3"/><circle cx="723" cy="300" r="3"/><circle cx="775" cy="300" r="3"/><circle cx="827" cy="300" r="3"/><circle cx="900" cy="300" r="3"/>
    <circle cx="650" cy="370" r="3"/><circle cx="719" cy="379" r="3"/><circle cx="779" cy="382" r="3"/><circle cx="830" cy="378" r="3"/><circle cx="900" cy="370" r="3"/>
  </g>
  <text x="775" y="300" fill="#f5b301" font-size="11" text-anchor="middle" dy="-52" opacity="0">.</text>
  <text x="775" y="150" fill="#f5b301" font-size="11" text-anchor="middle">box read from corner IDs → fine corners indexed (i,j) inside</text>
  <text x="775" y="440" fill="#f26d6d" font-size="12" text-anchor="middle">→ residual displacement field u(x) after removing mean expansion λ</text>

  <!-- ===================== BOTTOM: pipeline ===================== -->
  <rect x="80" y="548" width="960" height="98" rx="8" fill="#161a21" stroke="#2a313c"/>
  <g fill="#c7d0dc" font-size="12.5" text-anchor="middle">
    <text x="168" y="582">address</text><text x="168" y="599" fill="#7c8797" font-size="10">cv2.aruco → box IDs</text>
    <text x="358" y="582">measure</text><text x="358" y="599" fill="#7c8797" font-size="10">fine corners / box</text>
    <text x="545" y="582">index</text><text x="545" y="599" fill="#7c8797" font-size="10">(box,i,j) → match</text>
    <text x="720" y="582">de-expand</text><text x="720" y="599" fill="#7c8797" font-size="10">affine → λ, u(x)</text>
    <text x="915" y="582">strain F,E,J</text><text x="915" y="599" fill="#7c8797" font-size="10">det F = local expansion</text>
  </g>
  <g stroke="#4a5563" stroke-width="1.5" fill="none">
    <line x1="245" y1="586" x2="288" y2="586"/><polygon points="288,581 300,586 288,591" fill="#4a5563"/>
    <line x1="428" y1="586" x2="465" y2="586"/><polygon points="465,581 477,586 465,591" fill="#4a5563"/>
    <line x1="605" y1="586" x2="642" y2="586"/><polygon points="642,581 654,586 642,591" fill="#4a5563"/>
    <line x1="800" y1="586" x2="837" y2="586"/><polygon points="837,581 849,586 837,591" fill="#4a5563"/>
  </g>
  <text x="560" y="632" fill="#7c8797" font-size="10.5" text-anchor="middle">note: ArUco tags are sparse (only at box corners) → not a stock ChArUco board → two-stage detection</text>
</svg>
